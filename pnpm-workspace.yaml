packages:
  - "."

# pnpm 12 のデフォルトと同じ 24h。Renovate の npm minimumReleaseAge と揃える。
minimumReleaseAge: 1440

pmOnFail: ignore

allowBuilds:
  sharp: true
  core-js: false
  lefthook: false

overrides:
  node-fetch@2: npm:node-fetch-commonjs@^3.3.2
  undici: ">=6.27.0"
  # 以下は pnpm audit --audit-level high を通すための推移依存の引き上げ。
  # next は postcss を 8.4.31 に、sharp を ^0.34.5 に固定ピンしており next を
  # 最新 (16.2.12) にしても解消しないため override で揃える。
  # fast-uri / brace-expansion は devDep の shadcn 配下のみ (ajv / ts-morph>minimatch)。
  postcss: ^8.5.18 # GHSA sourceMappingURL 経由の任意ファイル読み取り / パストラバーサル
  sharp: ^0.35.3 # libvips 由来 CVE-2026-33327/33328/35590/35591 (直接依存は既に 0.35 系)
  fast-uri: ^4.0.0 # バックスラッシュ authority 区切りによる host confusion
  brace-expansion: ^5.0.8 # 展開長が無制限で OOM クラッシュする DoS
  smol-toml: ^1.7.1 # 不正な TOML による DoS (GHSA-7w5x-hrqm-74c2)。markdownlint-cli2 が 1.7.0 を固定ピンしている
  markdown-it: ^15.0.3 # smartquotes / link reference の二乗時間 DoS (GHSA-r7fv-28h4-cvq7, GHSA-gfr2-rv44-r23c)。markdownlint-cli2 0.23 が 15.0.1 を固定ピンしている
  zod: ^4.6.6 # GHSA-mrhx-c7xc-m3w5。@vercel/blob>@vercel/oidc>@vercel/cli-config が 4.1.11 を固定ピンしている
  body-parser: ^2.4.0 # GHSA-27r3-jxmh-p828。devDep の shadcn>@modelcontextprotocol/sdk>express 配下のみ
  katex: ^0.19.1 # GHSA-238p-pmpm-9mq7。devDep の markdownlint-cli2>markdownlint>micromark-extension-math が ^0.16.0 で止まっている
